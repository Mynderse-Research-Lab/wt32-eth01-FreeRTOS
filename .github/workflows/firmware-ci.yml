name: Firmware CI

# Builds the ESP-IDF firmware, runs the host (native) unit tests and checks
# the Markdown links on every push and pull request. All three jobs must pass
# before merging.
concurrency:
  group: firmware-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: ESP-IDF build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin the IDF version to the team's toolchain (ESP-IDF v6.0). Keep this
      # in sync with the version installed on developer machines.
      - name: Build firmware (idf.py build)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32
          path: 'idf'
          command: 'idf.py -DCONFIG_GANTRY_SUPPRESS_GEOMETRY_WARNING=y build'

  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships cmake, g++, make and git; install ninja for a fast,
      # deterministic generator.
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S test/host -B build/host -G Ninja

      - name: Build
        run: cmake --build build/host

      - name: Run tests
        run: ctest --test-dir build/host --output-on-failure

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Relative links only: --offline makes no network requests. The three
      # excluded documents were deleted on 2026-11-19 and wait for the new
      # math document (MATH_RELINK_INVENTORY.md). Drop the excludes
      # when those links are repointed.
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            --exclude 'PICK_SCHEDULER_KINEMATICS\.md'
            --exclude 'ON_THE_FLY_PICKUP\.md'
            --exclude 'PICK_COORDINATED_GRASP_VALIDATION\.md'
            './**/*.md'
